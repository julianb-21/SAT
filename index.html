  <body>
    <!--
      [LP-DEBUG] Meta Pixel stub: runs inline so window.fbq is defined before React
      mounts. fbevents.js loads async (never blocks paint). Any fbq() calls queued
      before fbevents.js loads are replayed automatically.
    -->
    <script>
      console.log('[LP] fbq-stub: starting inline init, visibilityState=' + document.visibilityState);
      !function(f,b,e,v,n,t,s)
      {if(f.fbq){console.log('[LP] fbq-stub: fbq already defined, skipping');return;}
      n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;
      t.onload=function(){console.log('[LP] fbevents.js: loaded successfully, queue length was ' + (f.fbq.queue||[]).length);};
      t.onerror=function(){console.error('[LP] fbevents.js: FAILED to load');};
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      console.log('[LP] fbq-stub: stub installed, window.fbq type=' + typeof window.fbq);
      fbq('init', '2103609790585624');
      fbq('track', 'PageView');
      console.log('[LP] fbq-stub: init+PageView queued, queue length=' + (window.fbq.queue||[]).length);

      // Log every future visibilitychange so we can see the IAB hidden/visible cycle
      document.addEventListener('visibilitychange', function() {
        console.log('[LP] visibilitychange: state=' + document.visibilityState + ' at t=' + Math.round(performance.now()) + 'ms');
      });
    </script>
    <noscript>
      <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2103609790585624&ev=PageView&noscript=1"/>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Clarity: deferred until after load so it never blocks LCP -->
    <script>
      window.addEventListener('load', function() {
        console.log('[LP] load event fired at t=' + Math.round(performance.now()) + 'ms, visibilityState=' + document.visibilityState);
        (function(c,l,a,r,i,t,y){

          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "x7lknuy6y7");
      });
    </script>
